name: Unit Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - master
    paths:
      - 'frigate/**'
      - 'requirements*.txt'
      - '.github/workflows/tests.yml'
      - 'pytest.ini'
  pull_request:
    branches:
      - main
      - dev
      - master
    paths:
      - 'frigate/**'
      - 'requirements*.txt'
      - '.github/workflows/tests.yml'
      - 'pytest.ini'

concurrency:
  group: ${{ github.ref }}-tests
  cancel-in-progress: true

env:
  PYTHON_VERSION: 3.11

jobs:
  test:
    runs-on: ubuntu-22.04
    name: Run Unit Tests
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build -f docker/main/Dockerfile -t frigate-test:latest . --target frigate

      - name: Run tests in Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace frigate-test:latest \
            bash -c "cd /workspace && python -m pip install -q -r requirements-test.txt && \
            python -m pytest frigate/test --cov=frigate --cov-report=xml --cov-report=term-missing"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
