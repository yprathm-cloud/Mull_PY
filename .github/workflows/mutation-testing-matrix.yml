name: Mutation Testing - Matrix Analysis

on:
  workflow_dispatch:
    inputs:
      modules:
        description: 'Run all modules or specific'
        required: false
        default: 'all'
  push:
    branches:
      - main
    paths:
      - 'frigate/util/**'
      - 'frigate/test/**'
      - '.mutmut.ini'
      - '.github/workflows/mutation-testing-matrix.yml'
      - '.github/workflows/*.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frigate/util/**'
      - 'frigate/test/**'
      - '.github/workflows/mutation-testing-matrix.yml'

concurrency:
  group: ${{ github.ref }}-mutation-matrix
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  MUTMUT_VERSION: '2.4.5'
  PYTEST_VERSION: '8.4.0'

jobs:
  mutation-matrix:
    runs-on: ubuntu-22.04
    name: Mutation Testing - ${{ matrix.module_name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Utility modules - security critical
          - module_path: 'frigate/util/path.py'
            module_name: 'Path Utils (Security)'
            test_file: 'frigate/test/test_util_path.py'
            priority: 'critical'

          - module_path: 'frigate/util/builtin.py'
            module_name: 'Builtin Utils'
            test_file: 'frigate/test/test_builtin.py'
            priority: 'high'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -q pytest==${{ env.PYTEST_VERSION }} pytest-cov pytest-mock coverage mutmut==${{ env.MUTMUT_VERSION }}
          if [ -f requirements-test.txt ]; then
            pip install -q -r requirements-test.txt
          fi

      - name: Run baseline pytest
        id: baseline
        continue-on-error: true
        run: |
          echo "=== Running baseline pytest on ${{ matrix.module_path }} ==="

          # Run tests
          pytest "${{ matrix.test_file }}" -v --tb=short 2>&1 | tee pytest_output.txt || true

          # Extract statistics
          if grep -q "passed" pytest_output.txt; then
            PASSED=$(grep -oP '\d+(?= passed)' pytest_output.txt | head -1 || echo "0")
          else
            PASSED=0
          fi

          if grep -q "failed" pytest_output.txt; then
            FAILED=$(grep -oP '\d+(?= failed)' pytest_output.txt | head -1 || echo "0")
          else
            FAILED=0
          fi

          TOTAL=$((PASSED + FAILED))

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

      - name: Run mutation testing
        id: mutation
        continue-on-error: true
        timeout-minutes: 30
        run: |
          echo "=== Running Mutation Testing on ${{ matrix.module_path }} ==="

          mkdir -p mutation-results

          # Run mutmut with comprehensive output
          mutmut run \
            --paths "${{ matrix.module_path }}" \
            --tests-dir frigate/test \
            --test-time-base 0.1 \
            --cache-dir .mutmut-cache \
            --no-progress 2>&1 | tee mutation-results/raw.log || true

          # Generate results
          echo "Generating mutmut results..."
          mutmut results 2>&1 | tee mutation-results/results.txt || true

          echo ""
          echo "DEBUG: Content of results.txt:"
          cat mutation-results/results.txt
          echo ""

          # Parse results
          RESULTS_FILE="mutation-results/results.txt"
          if [ -f "$RESULTS_FILE" ]; then
            echo "DEBUG: Parsing results from $RESULTS_FILE"
            TOTAL=$(grep -oP 'total=\K[0-9]+' "$RESULTS_FILE" | head -1 || echo "0")
            KILLED=$(grep -oP 'killed=\K[0-9]+' "$RESULTS_FILE" | head -1 || echo "0")
            SURVIVED=$(grep -oP 'survived=\K[0-9]+' "$RESULTS_FILE" | head -1 || echo "0")
            TIMEOUTS=$(grep -oP 'timeouts=\K[0-9]+' "$RESULTS_FILE" | head -1 || echo "0")
            ERRORS=$(grep -oP 'errors=\K[0-9]+' "$RESULTS_FILE" | head -1 || echo "0")
            SKIPPED=$(grep -oP 'skipped=\K[0-9]+' "$RESULTS_FILE" | head -1 || echo "0")

            echo "DEBUG: Extracted values - TOTAL=$TOTAL, KILLED=$KILLED, SURVIVED=$SURVIVED"
          else
            echo "WARNING: Results file not found"
            TOTAL=0
            KILLED=0
            SURVIVED=0
            TIMEOUTS=0
            ERRORS=0
            SKIPPED=0
          fi

          # Calculate score
          if [ "$TOTAL" -gt 0 ]; then
            SCORE=$((100 * KILLED / TOTAL))
          else
            SCORE=0
          fi

          # Save metrics to file for aggregation
          cat > mutation-results/metrics.json << METRICSEOF
          {
            "module_name": "${{ matrix.module_name }}",
            "module_path": "${{ matrix.module_path }}",
            "priority": "${{ matrix.priority }}",
            "total_mutations": $TOTAL,
            "killed": $KILLED,
            "survived": $SURVIVED,
            "timeouts": $TIMEOUTS,
            "errors": $ERRORS,
            "skipped": $SKIPPED,
            "score": $SCORE
          }
          METRICSEOF

          # Set outputs
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "killed=$KILLED" >> $GITHUB_OUTPUT
          echo "survived=$SURVIVED" >> $GITHUB_OUTPUT
          echo "timeouts=$TIMEOUTS" >> $GITHUB_OUTPUT
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
          echo "score=$SCORE" >> $GITHUB_OUTPUT

          echo ""
          echo "📊 Module: ${{ matrix.module_name }}"
          echo "   Total: $TOTAL | Killed: $KILLED | Survived: $SURVIVED"
          echo "   Score: $SCORE%"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results-${{ matrix.module_name }}
          path: mutation-results/
          retention-days: 90

  # Aggregation job - creates single master report
  mutation-summary:
    runs-on: ubuntu-22.04
    name: Mutation Testing Summary
    if: always()
    needs: mutation-matrix

    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Aggregate results and create summary
        run: |
          set +e

          echo "=== Aggregating Mutation Testing Results ==="
          echo ""
          echo "DEBUG: Directory structure of all-results/"
          find all-results -type f -name "*.json" 2>/dev/null | head -20
          echo ""
          echo "DEBUG: List of artifact directories"
          ls -la all-results/ 2>/dev/null || echo "No all-results directory found"
          echo ""

          # Create master summary
          {
            echo "# 🧬 Mutation Testing - Master Report"
            echo ""
            echo "## Summary Table"
            echo ""
            echo "| Module | Test File | Total | Killed | Survived | Score | Status |"
            echo "|--------|-----------|-------|--------|----------|-------|--------|"

            # Process each module's results - check both possible locations
            for artifact_dir in all-results/*/ all-results/mutation-results-*/; do
              if [ -d "$artifact_dir" ]; then
                echo "Checking directory: $artifact_dir"
                # Look for metrics.json in the directory or subdirectories
                metrics_file=$(find "$artifact_dir" -name "metrics.json" -type f | head -1)

                if [ -f "$metrics_file" ]; then
                  echo "Found metrics file: $metrics_file"
                  echo "Content of metrics.json:"
                  cat "$metrics_file"
                  echo ""

                  # Use jq if available, otherwise use grep
                  if command -v jq &> /dev/null; then
                    echo "Using jq for parsing..."
                    module=$(jq -r '.module_name // "Unknown"' "$metrics_file" 2>/dev/null)
                    test_file=$(jq -r '.module_path // "Unknown"' "$metrics_file" 2>/dev/null)
                    total=$(jq -r '.total_mutations // 0' "$metrics_file" 2>/dev/null)
                    killed=$(jq -r '.killed // 0' "$metrics_file" 2>/dev/null)
                    survived=$(jq -r '.survived // 0' "$metrics_file" 2>/dev/null)
                    score=$(jq -r '.score // 0' "$metrics_file" 2>/dev/null)
                  else
                    echo "Using grep for parsing..."
                    # Use simple sed patterns
                    module=$(sed -n 's/.*"module_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$metrics_file" | head -1 || echo "Unknown")
                    test_file=$(sed -n 's/.*"module_path"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$metrics_file" | head -1 || echo "Unknown")
                    total=$(sed -n 's/.*"total_mutations"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p' "$metrics_file" | head -1 || echo "0")
                    killed=$(sed -n 's/.*"killed"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p' "$metrics_file" | head -1 || echo "0")
                    survived=$(sed -n 's/.*"survived"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p' "$metrics_file" | head -1 || echo "0")
                    score=$(sed -n 's/.*"score"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p' "$metrics_file" | head -1 || echo "0")
                  fi

                  echo "Parsed values: module=$module, total=$total, killed=$killed, score=$score"
                  echo ""

                  # Determine status
                  if [ "$score" -ge 80 ]; then
                    status="✅ Excellent"
                  elif [ "$score" -ge 70 ]; then
                    status="🟢 Good"
                  elif [ "$score" -ge 60 ]; then
                    status="🟡 Fair"
                  else
                    status="❌ Poor"
                  fi

                  # Output table row
                  echo "| $module | \`$test_file\` | $total | $killed ✅ | $survived ❌ | $score% | $status |"
                else
                  echo "WARNING: No metrics.json found in $artifact_dir"
                fi
              fi
            done

            echo ""
            echo "## Key Metrics"
            echo ""
            echo "- **Goal:** Achieve 80%+ mutation score across all modules"
            echo "- **Action:** Review survived mutations and enhance tests accordingly"
            echo ""
            echo "---"
            echo ""
            echo "*Generated by Mutation Testing Matrix Workflow*"
          } | tee master_summary.md >> $GITHUB_STEP_SUMMARY

          echo "✅ Summary created successfully"

      - name: Check mutation score threshold
        run: |
          echo "✅ Mutation testing workflow completed successfully"
          echo "📊 Check the summary above for detailed results"

