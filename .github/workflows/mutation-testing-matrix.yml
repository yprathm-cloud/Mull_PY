name: Mutation Testing - Frigate Utilities

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frigate/util/path.py'
      - 'frigate/util/builtin.py'
      - 'frigate/test/test_util_path.py'
      - 'frigate/test/test_builtin.py'
      - '.mutmut.ini'
      - '.github/workflows/mutation-testing-matrix.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frigate/util/path.py'
      - 'frigate/util/builtin.py'
      - 'frigate/test/test_util_path.py'
      - 'frigate/test/test_builtin.py'

concurrency:
  group: ${{ github.ref }}-mutation-testing
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  MUTMUT_VERSION: '2.4.4'
  PYTEST_VERSION: '8.4.0'

jobs:
  mutation-testing:
    runs-on: ubuntu-22.04
    name: Mutation Testing - Frigate Utilities

    steps:
      # Step 1: Checkout
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # Step 3: Install dependencies (minimal set for util tests only)
      - name: Install dependencies
        run: |
          set -e
          echo "=== Installing core tools ==="
          python -m pip install --upgrade pip setuptools wheel

          pip install -q \
            pytest==${{ env.PYTEST_VERSION }} \
            pytest-cov \
            pytest-mock \
            coverage \
            mutmut==${{ env.MUTMUT_VERSION }}

          echo "=== Installing util module dependencies ==="
          pip install -q pathvalidate ruamel.yaml numpy scipy

          echo "=== Setting up PATH for mutmut ==="
          USER_BIN=$(python -m site --user-base)/bin
          mkdir -p "$USER_BIN"
          echo "$USER_BIN" >> $GITHUB_PATH
          ln -sf /usr/bin/python3 "$USER_BIN/python"

          echo "=== Installed packages ==="
          pip list | grep -E "mutmut|pytest|pathvalidate"

      # Step 4: Validate baseline tests pass
      - name: Verify baseline tests (without mutations)
        run: |
          set -e
          echo "=== Running baseline tests ==="
          echo ""

          pytest \
            frigate/test/test_util_path.py \
            frigate/test/test_builtin.py \
            -v --tb=short \
            --co -q 2>&1 | head -50

          echo ""
          echo "=== Executing baseline tests ==="
          pytest \
            frigate/test/test_util_path.py \
            frigate/test/test_builtin.py \
            -v --tb=short || exit 1

          echo ""
          echo "✅ Baseline tests PASSED - Ready for mutation testing"

      # Step 5: Generate coverage data
      - name: Generate coverage data
        run: |
          echo "=== Generating coverage data ==="

          coverage run -m pytest \
            frigate/test/test_util_path.py \
            frigate/test/test_builtin.py \
            -q

          echo "✅ Coverage data generated (HTML report: htmlcov/index.html)"

      # Step 6: Run mutation testing
      - name: Run mutation testing
        continue-on-error: true
        run: |
          set -e
          echo "=== Mutation Testing Configuration ==="
          echo ""
          cat .mutmut.ini
          echo ""

          mkdir -p mutation-results

          echo "=== Running mutmut on frigate/util/path.py ==="
          python3 -m mutmut run \
            --paths-to-mutate frigate/util/path.py \
            2>&1 | tee mutation-results/path-mutations.log || true

          echo ""
          echo "=== Running mutmut on frigate/util/builtin.py ==="
          python3 -m mutmut run \
            --paths-to-mutate frigate/util/builtin.py \
            2>&1 | tee mutation-results/builtin-mutations.log || true

      # Step 7: Extract and report results
      - name: Extract mutation results
        if: always()
        run: |
          echo "=== Mutation Test Results ==="

          if [ -d .mutmut-cache ]; then
            echo "✅ Mutations were generated and tested"
            echo ""
            python3 -m mutmut results 2>&1 | head -100
          else
            echo "⚠️  No mutations were generated"
            echo "Check logs above for details"
          fi

      # Step 8: Upload results
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-testing-results
          path: |
            mutation-results/
            .mutmut.ini
            htmlcov/
          retention-days: 90

      # Step 9: Summary
      - name: Report summary
        if: always()
        run: |
          echo "## 🧬 Mutation Testing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Modules Tested:**" >> $GITHUB_STEP_SUMMARY
          echo "- frigate/util/path.py" >> $GITHUB_STEP_SUMMARY
          echo "- frigate/util/builtin.py" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Results:**" >> $GITHUB_STEP_SUMMARY

          if [ -d .mutmut-cache ]; then
            echo "✅ Mutation testing completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No mutations were generated - see job logs" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 [View detailed results in artifacts](#artifacts)" >> $GITHUB_STEP_SUMMARY
