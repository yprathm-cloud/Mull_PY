name: Mutation Testing

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frigate/**'
      - 'requirements-test.txt'
      - '.mutmut.ini'
      - '.github/workflows/mutation-testing.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frigate/**'
      - 'requirements-test.txt'

concurrency:
  group: ${{ github.ref }}-mutation
  cancel-in-progress: true

env:
  PYTHON_VERSION: 3.11

jobs:
  mutation-test:
    runs-on: ubuntu-22.04
    name: Mutation Testing Analysis
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q pytest pytest-mock coverage mutmut

      - name: Run mutation tests on simple modules
        id: mutation
        continue-on-error: true
        run: |
          echo "Running mutation tests..."
          # Test only simple modules without heavy dependencies
          mutmut run --tests-dir frigate/test \
            --paths frigate/util/builtin.py,frigate/const.py \
            --cache-dir .mutmut-cache \
            --no-progress 2>&1 | tee mutation-results.txt || true

          # Extract results
          TOTAL=$(grep -oP 'total=\K[0-9]+' mutation-results.txt | head -1 || echo "0")
          KILLED=$(grep -oP 'killed=\K[0-9]+' mutation-results.txt | head -1 || echo "0")
          SURVIVED=$(grep -oP 'survived=\K[0-9]+' mutation-results.txt | head -1 || echo "0")

          if [ "$TOTAL" -gt 0 ]; then
            SCORE=$((100 * KILLED / TOTAL))
          else
            SCORE=0
          fi

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "killed=$KILLED" >> $GITHUB_OUTPUT
          echo "survived=$SURVIVED" >> $GITHUB_OUTPUT
          echo "score=$SCORE" >> $GITHUB_OUTPUT

      - name: Generate mutation test report
        if: always()
        run: |
          echo "## Mutation Testing Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mutation Score:** ${{ steps.mutation.outputs.score }}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Mutations | ${{ steps.mutation.outputs.total }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Killed (Caught) | ${{ steps.mutation.outputs.killed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Survived (Missed) | ${{ steps.mutation.outputs.survived }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Mutation testing helps identify weak tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Goal:** Aim for 80%+ mutation score" >> $GITHUB_STEP_SUMMARY

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-test-results
          path: mutation-results.txt
          retention-days: 30
