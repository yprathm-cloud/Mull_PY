[mutmut]
# Paths to mutate (code directories)
paths_to_mutate = frigate
# Paths to test
tests_dir = frigate/test
# Python version
python_version = 3.11
# Exclude certain files from mutation
exclude = frigate/test/,migrations/,docs/
# Number of workers for parallel execution
workers = 4
# Test command to run
test_cmd = pytest --tb=short -q
# Coverage test command
coverage_cmd = coverage run -m pytest
