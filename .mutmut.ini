[mutmut]
# Professional mutation testing configuration for Frigate utilities
# Based on best practices from Mull (C++ mutation testing tool)

# Paths to mutate: Only frigate/util/
paths_to_mutate = frigate/util

# Test directory
tests_dir = frigate/test

# Exclude patterns: Skip test files and non-source directories
exclude_patterns =
    frigate/test/,
    migrations/,
    docs/,
    __pycache__/,
    *.pyc

# Mutation testing parameters
python_version = 3.11
test_time_multiplier = 1.5
workers = 2
